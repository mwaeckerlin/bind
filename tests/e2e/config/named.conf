// A configuration an administrator wrote himself and mounts on /etc/bind; it
// replaces everything the image was built with.

logging {
  channel simplelog {
    stderr;
    severity warning;
    print-category yes;
    print-severity yes;
    print-time yes;
  };
  category default { simplelog; };
};

options {
  directory "/var/bind";
  pid-file "/var/run/named/named.pid";
  listen-on port 9953 { any; };
  listen-on-v6 { none; };
  recursion no;
  allow-transfer { none; };
  version none;
};

controls { };

zone "mounted.example" {
  type master;
  allow-query { any; };
  file "/etc/bind/mounted.example";
};
